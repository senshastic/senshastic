name: Update Coding Stats

on:
  schedule:
    - cron: '0 4 * * 1'   # every Monday 4am UTC
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate stats SVG
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const USERNAME = 'senshastic';
            const DAYS = 30;

            const since = new Date(Date.now() - DAYS * 86400000).toISOString();
            const fmtDate = d => new Date(d).toLocaleDateString('en-US', { month:'short', day:'numeric' });
            const period  = `${fmtDate(since)} \u2013 ${fmtDate(new Date())}`;
            const fmt     = n => n >= 1000 ? n.toLocaleString() : String(n);
            const esc     = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

            // ── fetch events (up to 300) ─────────────────────────────────────
            let allEvents = [];
            for (let page = 1; page <= 3; page++) {
              const { data } = await github.rest.activity.listEventsForAuthenticatedUser({
                username: USERNAME, per_page: 100, page
              }).catch(() => ({ data: [] }));
              if (!data.length) break;
              const inWindow = data.filter(e => e.created_at >= since);
              allEvents = allEvents.concat(inWindow);
              if (inWindow.length < data.length) break;
            }
            console.log(`Events in window: ${allEvents.length}`);

            // ── collect repos from PushEvent, CreateEvent, ForkEvent ─────────
            const activeRepos = new Set();
            const seedShas = {};

            for (const e of allEvents) {
              if (e.type === 'PushEvent') {
                activeRepos.add(e.repo.name);
                if (!seedShas[e.repo.name]) seedShas[e.repo.name] = new Set();
                for (const c of (e.payload.commits || [])) seedShas[e.repo.name].add(c.sha);
                if (e.payload.head) seedShas[e.repo.name].add(e.payload.head);
              } else if (e.type === 'CreateEvent' && e.payload.ref_type === 'repository') {
                activeRepos.add(e.repo.name);
              } else if (e.type === 'ForkEvent' && e.payload.forkee) {
                activeRepos.add(e.payload.forkee.full_name);
              }
            }
            // ── also scan user's own repos sorted by push time ───────────────
            // catches repos missed by the events API (e.g. merge-only activity)
            const { data: userRepos } = await github.rest.repos.listForUser({
              username: USERNAME, per_page: 100, sort: 'pushed', direction: 'desc'
            }).catch(() => ({ data: [] }));
            for (const repo of userRepos) {
              if (new Date(repo.pushed_at) < new Date(since)) break;
              if (activeRepos.has(repo.full_name)) continue;
              const { data: check } = await github.rest.repos.listCommits({
                owner: repo.owner.login, repo: repo.name,
                since, per_page: 1
              }).catch(() => ({ data: [] }));
              if (check.length > 0) activeRepos.add(repo.full_name);
            }
            console.log(`Active repos: ${[...activeRepos].join(', ')}`);

            // ── fetch all commits by user in range per repo ──────────────────
            const repoCommitShas = {};
            for (const fullRepo of activeRepos) {
              const [owner, repo] = fullRepo.split('/');
              const shas = new Set(seedShas[fullRepo] || []);
              for (let page = 1; page <= 2; page++) {
                const { data: commits } = await github.rest.repos.listCommits({
                  owner, repo, author: USERNAME, since, per_page: 100, page
                }).catch(() => ({ data: [] }));
                if (!commits.length) break;
                for (const c of commits) shas.add(c.sha);
                if (commits.length < 100) break;
              }
              if (shas.size > 0) repoCommitShas[fullRepo] = shas;
            }

            // ── per-commit stats ─────────────────────────────────────────────
            let totalAdd = 0, totalDel = 0, totalCommits = 0;
            const repoStats = {};
            for (const [fullRepo, shas] of Object.entries(repoCommitShas)) {
              const [owner, repo] = fullRepo.split('/');
              let radd = 0, rdel = 0;
              for (const sha of [...shas].slice(0, 15)) {
                const { data } = await github.rest.repos.getCommit({ owner, repo, ref: sha }).catch(() => ({ data: {} }));
                radd += data.stats?.additions || 0;
                rdel += data.stats?.deletions || 0;
              }
              repoStats[fullRepo] = { add: radd, del: rdel, commits: shas.size };
              totalAdd += radd; totalDel += rdel; totalCommits += shas.size;
            }

            // ── languages ────────────────────────────────────────────────────
            const langBytes = {};
            for (const fullRepo of Object.keys(repoCommitShas)) {
              const [owner, repo] = fullRepo.split('/');
              const { data } = await github.rest.repos.listLanguages({ owner, repo }).catch(() => ({ data: {} }));
              for (const [lang, b] of Object.entries(data)) langBytes[lang] = (langBytes[lang] || 0) + b;
            }
            const totalLB = Object.values(langBytes).reduce((a,b)=>a+b,0) || 1;
            const topLangs = Object.entries(langBytes).sort((a,b)=>b[1]-a[1]).slice(0,5);
            const topRepos = Object.entries(repoStats).sort((a,b)=>(b[1].add+b[1].del)-(a[1].add+a[1].del)).slice(0,5);
            const repoCount = Object.keys(repoCommitShas).length;
            console.log(`+${totalAdd} / -${totalDel}, ${repoCount} repos, ${totalCommits} commits`);

            // ══════════════════════════════════════════════════════════════════
            // SVG — SNESHLIB design
            // ══════════════════════════════════════════════════════════════════
            const CREAM       = '#d0b575';
            const CREAM_MUTED = '#7a6035';
            const GREEN  = '#7ec87e';
            const RED    = '#c47070';
            const BLUE   = '#7ab0cf';
            const PURPLE = '#a08fd4';
            const WHITE  = '#e0d5c8';
            const MUTED  = '#5a4e42';
            const DIM    = '#302820';
            const LANG_COLORS = {
              JavaScript:'#f1e05a', TypeScript:'#3178c6', Python:'#3572A5',
              HTML:'#e34c26', CSS:'#563d7c', SCSS:'#c6538c', Shell:'#89e051',
              Rust:'#dea584', Go:'#00ADD8', Java:'#b07219', 'C++':'#f34b7d',
              C:'#555555', Ruby:'#701516', PHP:'#4F5D95', Kotlin:'#A97BFF',
              Swift:'#F05138', Dart:'#00B4AB', Vue:'#41b883', Svelte:'#ff3e00',
              Lua:'#000080', Less:'#1d365d',
            };

            const W = 740, PAD = 22, RXC = 14;
            const SP_Y = 55, SP_H = 94;
            const BP_GAP = 14;
            const BP_Y = SP_Y + SP_H + 22;
            const BP_W = Math.floor((W - PAD * 2 - BP_GAP) / 2);
            const LANG_ROWS = Math.max(topLangs.length, 1);
            const REPO_ROWS = topRepos.length;
            const ROW_H = 28;
            const BP_H = 36 + Math.max(LANG_ROWS, REPO_ROWS) * ROW_H + 14;
            const H_FOOT = 34;
            const H_TOTAL = BP_Y + BP_H + H_FOOT;
            const PERIM = 2 * (W + H_TOTAL);
            const DASH_VIS = Math.round(PERIM * 0.18);
            const DASH_GAP = PERIM - DASH_VIS;
            const MF = 'font-family="\'Cascadia Code\',\'Fira Code\',\'SF Mono\',ui-monospace,monospace"';

            const lines = [];
            const add = s => lines.push(s);

            add(`<svg width="${W}" height="${H_TOTAL}" viewBox="0 0 ${W} ${H_TOTAL}" xmlns="http://www.w3.org/2000/svg">`);
            add('<defs>');
            add('<style>');
            add('  @keyframes fadein { from{opacity:0} to{opacity:1} }');
            add('  @keyframes pulse  { 0%,100%{opacity:1} 50%{opacity:.4} }');
            add(`  @keyframes snake  { 0%{stroke-dashoffset:0} 100%{stroke-dashoffset:-${PERIM}} }`);
            add('  .card   { animation: fadein .4s ease-out both; }');
            add('  .snake  { animation: snake 5s linear infinite; }');
            add('  .p1     { animation: pulse 4s ease-in-out infinite; }');
            add('  .p2     { animation: pulse 4s ease-in-out infinite .8s; }');
            add('  .p3     { animation: pulse 4s ease-in-out infinite 1.6s; }');
            add('  .p4     { animation: pulse 4s ease-in-out infinite 2.4s; }');
            add('</style>');
            add('<linearGradient id="bg" x1="0" y1="0" x2=".6" y2="1">');
            add('  <stop offset="0%"   stop-color="#1c1625"/>');
            add('  <stop offset="50%"  stop-color="#140f1c"/>');
            add('  <stop offset="100%" stop-color="#0e0b14"/>');
            add('</linearGradient>');
            add('<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">');
            add('  <stop offset="0%"  stop-color="#ffffff" stop-opacity=".07"/>');
            add('  <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>');
            add('</linearGradient>');
            add(`<linearGradient id="creamBar" x1="0" y1="0" x2="1" y2="0">`);
            add(`  <stop offset="0%"   stop-color="${CREAM}" stop-opacity="0"/>`);
            add(`  <stop offset="20%"  stop-color="${CREAM}" stop-opacity=".7"/>`);
            add(`  <stop offset="80%"  stop-color="${CREAM}" stop-opacity=".7"/>`);
            add(`  <stop offset="100%" stop-color="${CREAM}" stop-opacity="0"/>`);
            add('</linearGradient>');
            add('<filter id="creamGlow" x="-40%" y="-40%" width="180%" height="180%">');
            add('  <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>');
            add('  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>');
            add('</filter>');
            add('<filter id="numglow" x="-60%" y="-60%" width="220%" height="220%">');
            add('  <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>');
            add('  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>');
            add('</filter>');
            add('<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse">');
            add('  <path d="M8 0 L0 8" stroke="#ffffff" stroke-opacity=".035" stroke-width=".5"/>');
            add('  <path d="M0 0 L8 8" stroke="#ffffff" stroke-opacity=".02"  stroke-width=".5"/>');
            add('</pattern>');
            for (const [lang] of topLangs) {
              const c = LANG_COLORS[lang] || MUTED;
              const id = `lb_${lang.replace(/[^a-z0-9]/gi,'_')}`;
              add(`<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="0">`);
              add(`  <stop offset="0%"   stop-color="${c}" stop-opacity=".9"/>`);
              add(`  <stop offset="70%"  stop-color="${c}" stop-opacity=".5"/>`);
              add(`  <stop offset="100%" stop-color="${c}" stop-opacity=".1"/>`);
              add('</linearGradient>');
            }
            add(`<clipPath id="clip"><rect width="${W}" height="${H_TOTAL}" rx="${RXC}"/></clipPath>`);
            add('</defs>');
            add('<g class="card">');
            add('<g clip-path="url(#clip)">');
            add(`<rect width="${W}" height="${H_TOTAL}" fill="url(#bg)"/>`);
            add(`<rect width="${W}" height="${H_TOTAL}" fill="url(#hatch)"/>`);
            add('</g>');
            add(`<rect width="${W}" height="${H_TOTAL}" rx="${RXC}" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="1"/>`);
            add(`<rect width="${W}" height="${H_TOTAL}" rx="${RXC}" fill="none" stroke="${CREAM}" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="${DASH_VIS} ${DASH_GAP}" class="snake"/>`);
            add(`<text x="${PAD}" y="38" ${MF} font-size="11" font-weight="700" fill="${CREAM}" letter-spacing="3.5" filter="url(#creamGlow)">CODING STATS</text>`);
            add(`<text x="${PAD+134}" y="38" ${MF} font-size="10" fill="${MUTED}" letter-spacing="1.5">\u00b7 LAST ${DAYS} DAYS</text>`);
            add(`<text x="${W-PAD}" y="38" ${MF} font-size="9.5" fill="${MUTED}" text-anchor="end">${esc(period)}</text>`);
            add(`<rect x="${PAD}" y="${SP_Y}" width="${W-PAD*2}" height="${SP_H}" rx="10" fill="#ffffff" fill-opacity=".05"/>`);
            add(`<rect x="${PAD}" y="${SP_Y}" width="${W-PAD*2}" height="${SP_H}" rx="10" fill="url(#sheen)"/>`);
            add(`<rect x="${PAD}" y="${SP_Y}" width="${W-PAD*2}" height="${SP_H}" rx="10" fill="none" stroke="#ffffff" stroke-opacity=".1" stroke-width="1"/>`);
            add(`<rect x="${PAD+1}" y="${SP_Y+1}" width="${W-PAD*2-2}" height="1" fill="#ffffff" fill-opacity=".06"/>`);
            const statDefs = [
              [`+${fmt(totalAdd)}`, 'lines added',   GREEN,  'p1'],
              [`-${fmt(totalDel)}`, 'lines removed', RED,    'p2'],
              [String(repoCount),   'repos',         BLUE,   'p3'],
              [String(totalCommits),'commits',       PURPLE, 'p4'],
            ];
            const CW = Math.floor((W - PAD * 2) / 4);
            for (const [i, [val, label, color, cls]] of statDefs.entries()) {
              const cx = PAD + i * CW + Math.floor(CW / 2);
              if (i > 0) add(`<line x1="${PAD + i * CW}" y1="${SP_Y+16}" x2="${PAD + i * CW}" y2="${SP_Y+SP_H-16}" stroke="#ffffff" stroke-opacity=".06" stroke-width="1"/>`);
              const fs2 = val.length <= 5 ? 25 : val.length <= 7 ? 21 : 18;
              add(`<text x="${cx}" y="${SP_Y+52}" ${MF} font-size="${fs2}" font-weight="700" fill="${color}" text-anchor="middle" filter="url(#numglow)" class="${cls}">${esc(val)}</text>`);
              add(`<text x="${cx}" y="${SP_Y+72}" ${MF} font-size="8.5" fill="${MUTED}" text-anchor="middle" letter-spacing="1.5">${label}</text>`);
            }
            add(`<rect x="${PAD}" y="${SP_Y+SP_H+10}" width="${W-PAD*2}" height="1" fill="url(#creamBar)" opacity=".5"/>`);
            const glassPanel = (x, y, w, h) => {
              add(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="#ffffff" fill-opacity=".05"/>`);
              add(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="url(#sheen)"/>`);
              add(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="none" stroke="#ffffff" stroke-opacity=".09" stroke-width="1"/>`);
              add(`<rect x="${x+1}" y="${y+1}" width="${w-2}" height="1" fill="#ffffff" fill-opacity=".05"/>`);
            };
            const LX = PAD, RX2 = PAD + BP_W + BP_GAP;
            glassPanel(LX, BP_Y, BP_W, BP_H);
            glassPanel(RX2, BP_Y, BP_W, BP_H);
            const lhdY = BP_Y + 18;
            add(`<text x="${LX+12}" y="${lhdY}" ${MF} font-size="7" font-weight="700" fill="${CREAM_MUTED}" letter-spacing="3">LANGUAGES</text>`);
            const BAR_X = LX + 96, BAR_W2 = BP_W - 96 - 30, BAR_H2 = 5;
            for (const [i, [lang, b]] of topLangs.entries()) {
              const ly   = lhdY + 18 + i * ROW_H;
              const pct  = Math.round(b / totalLB * 100);
              const lc   = LANG_COLORS[lang] || MUTED;
              const gid  = `lb_${lang.replace(/[^a-z0-9]/gi,'_')}`;
              const fill = Math.max(4, Math.round(BAR_W2 * pct / 100));
              add(`<circle cx="${LX+17}" cy="${ly+3}" r="3.5" fill="${lc}" opacity=".9"/>`);
              add(`<text x="${LX+26}" y="${ly+7}" ${MF} font-size="10.5" fill="${WHITE}">${esc(lang)}</text>`);
              add(`<rect x="${BAR_X}" y="${ly}" width="${BAR_W2}" height="${BAR_H2}" rx="2.5" fill="#ffffff" fill-opacity=".05"/>`);
              add(`<rect x="${BAR_X}" y="${ly}" width="${fill}" height="${BAR_H2}" rx="2.5" fill="url(#${gid})"/>`);
              add(`<text x="${LX+BP_W-8}" y="${ly+7}" ${MF} font-size="9" fill="${MUTED}" text-anchor="end">${pct}%</text>`);
            }
            const rhdY = BP_Y + 18;
            add(`<text x="${RX2+12}" y="${rhdY}" ${MF} font-size="7" font-weight="700" fill="${CREAM_MUTED}" letter-spacing="3">TOP REPOS</text>`);
            for (const [i, [repo, s]] of topRepos.entries()) {
              const ry    = rhdY + 18 + i * ROW_H;
              const short = repo.split('/')[1];
              if (i % 2 === 0) add(`<rect x="${RX2+6}" y="${ry-10}" width="${BP_W-12}" height="${ROW_H-2}" rx="5" fill="#ffffff" fill-opacity=".03"/>`);
              add(`<text x="${RX2+14}" y="${ry+6}" ${MF} font-size="11" fill="${WHITE}">${esc(short)}</text>`);
              add(`<text x="${RX2+BP_W-8}" y="${ry+6}" ${MF} font-size="9" text-anchor="end"><tspan fill="${GREEN}">+${fmt(s.add)}</tspan><tspan fill="${DIM}">  </tspan><tspan fill="${RED}">-${fmt(s.del)}</tspan><tspan fill="${DIM}">  </tspan><tspan fill="${MUTED}">${s.commits}c</tspan></text>`);
            }
            add(`<text x="${Math.floor(W/2)}" y="${H_TOTAL-12}" ${MF} font-size="7.5" fill="${CREAM_MUTED}" text-anchor="middle" letter-spacing="2.5" opacity=".6">AUTO \u00b7 UPDATED \u00b7 WEEKLY</text>`);
            add('</g>');
            add('</svg>');

            fs.writeFileSync('stats.svg', lines.join('\n'));
            console.log(`Written stats.svg (${W}x${H_TOTAL}px)`);

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg
          git diff --cached --quiet || git commit -m "chore: update coding stats [skip ci]"
          git push
