name: Update Coding Stats

on:
  schedule:
    - cron: '0 4 * * 1'   # every Monday 4am UTC
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate stats SVG
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const USERNAME = 'senshastic';
            const DAYS = 30;

            const since = new Date(Date.now() - DAYS * 86400000).toISOString();
            const fmtDate = d => new Date(d).toLocaleDateString('en-GB', { day:'numeric', month:'short' });
            const period  = `${fmtDate(since)} – ${fmtDate(new Date())}`;
            const fmt     = n => n >= 1000 ? n.toLocaleString() : String(n);

            // ── push events ──────────────────────────────────────────────────
            const { data: events } = await github.rest.activity.listEventsForAuthenticatedUser({
              username: USERNAME, per_page: 100
            });

            console.log(`Total events fetched: ${events.length}`);
            console.log(`Since: ${since}`);
            const allPush = events.filter(e => e.type === 'PushEvent');
            console.log(`Total PushEvents (any date): ${allPush.length}`);

            const pushEvents = events.filter(e =>
              e.type === 'PushEvent' && e.created_at >= since
            );
            console.log(`PushEvents in last ${DAYS} days: ${pushEvents.length}`);
            // collect repo → [sha] using head SHA from each push event
            const repoCommits = {};
            for (const e of pushEvents) {
              const repo = e.repo.name;
              const sha = e.payload.head;
              if (sha) (repoCommits[repo] = repoCommits[repo] || []).push(sha);
            }

            // ── commit stats ──────────────────────────────────────────────────
            let totalAdd = 0, totalDel = 0, totalCommits = 0;
            const repoStats = {};

            for (const [fullRepo, shas] of Object.entries(repoCommits)) {
              const [owner, repo] = fullRepo.split('/');
              let radd = 0, rdel = 0;
              const seen = [...new Set(shas)].slice(0, 10);
              for (const sha of seen) {
                try {
                  const { data } = await github.rest.repos.getCommit({ owner, repo, ref: sha });
                  radd += data.stats?.additions || 0;
                  rdel += data.stats?.deletions || 0;
                } catch (_) {}
              }
              repoStats[fullRepo] = { add: radd, del: rdel, commits: shas.length };
              totalAdd += radd; totalDel += rdel; totalCommits += shas.length;
            }

            // ── language breakdown ────────────────────────────────────────────
            const langBytes = {};
            for (const fullRepo of Object.keys(repoCommits)) {
              const [owner, repo] = fullRepo.split('/');
              try {
                const { data } = await github.rest.repos.listLanguages({ owner, repo });
                for (const [lang, b] of Object.entries(data)) {
                  langBytes[lang] = (langBytes[lang] || 0) + b;
                }
              } catch (_) {}
            }
            const totalLB = Object.values(langBytes).reduce((a,b)=>a+b,0) || 1;
            const topLangs = Object.entries(langBytes).sort((a,b)=>b[1]-a[1]).slice(0,5);

            // ── top repos ─────────────────────────────────────────────────────
            const topRepos = Object.entries(repoStats)
              .sort((a,b) => (b[1].add+b[1].del) - (a[1].add+a[1].del))
              .slice(0,5);

            console.log(`+${totalAdd} / -${totalDel}, ${Object.keys(repoCommits).length} repos, ${totalCommits} commits`);

            // ── SVG ───────────────────────────────────────────────────────────
            const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

            const CYAN   = '#00d4ff';
            const PURPLE = '#a855f7';
            const GREEN  = '#10b981';
            const RED    = '#ef4444';
            const GOLD   = '#f59e0b';
            const WHITE  = '#f1f5f9';
            const SUB    = '#4b5563';
            const SUBL   = '#6b7280';

            const LANG_COLORS = {
              JavaScript:'#f1e05a', TypeScript:'#3178c6', Python:'#3572A5',
              HTML:'#e34c26', CSS:'#563d7c', SCSS:'#c6538c', Shell:'#89e051',
              Rust:'#dea584', Go:'#00ADD8', Java:'#b07219', 'C++':'#f34b7d',
              C:'#555555', Ruby:'#701516', PHP:'#4F5D95', Kotlin:'#A97BFF',
              Swift:'#F05138', Dart:'#00B4AB', Vue:'#41b883', Svelte:'#ff3e00',
              Lua:'#000080',
            };

            const W = 860, PAD = 32;
            const H_HEADER  = 66;
            const H_STATS   = 110;
            const COL_GAP   = 24;
            const COL_W     = Math.floor((W - PAD*2 - COL_GAP) / 2);
            const H_LANGS_C = 44 + Math.max(topLangs.length,1)*32 + 12;
            const H_REPOS_C = topRepos.length ? 44 + topRepos.length*32 + 12 : 0;
            const H_BOTTOM  = Math.max(H_LANGS_C, H_REPOS_C || H_LANGS_C);
            const H_FOOT    = 32;
            const H = H_HEADER + H_STATS + H_BOTTOM + H_FOOT;

            const lines = [];
            const add = s => lines.push(s);

            add(`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`);

            // ── defs ──────────────────────────────────────────────────────────
            add('<defs>');
            add('<style>');
            add('  @keyframes pulse  { 0%,100%{opacity:1} 50%{opacity:0.65} }');
            add('  @keyframes fadein { from{opacity:0} to{opacity:1} }');
            add('  .anim-1 { animation: pulse 4s ease-in-out infinite; }');
            add('  .anim-2 { animation: pulse 4s ease-in-out infinite 0.8s; }');
            add('  .anim-3 { animation: pulse 4s ease-in-out infinite 1.6s; }');
            add('  .anim-4 { animation: pulse 4s ease-in-out infinite 2.4s; }');
            add('  .card   { animation: fadein 0.6s ease-out both; }');
            add('</style>');
            add('<linearGradient id="bgGrad" x1="0" y1="0" x2="0.4" y2="1">');
            add('  <stop offset="0%"   stop-color="#0f0f1a"/>');
            add('  <stop offset="100%" stop-color="#080810"/>');
            add('</linearGradient>');
            add(`<linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">`);
            add(`  <stop offset="0%"   stop-color="${PURPLE}"/>`);
            add(`  <stop offset="50%"  stop-color="${CYAN}"/>`);
            add(`  <stop offset="100%" stop-color="${GREEN}"/>`);
            add('</linearGradient>');
            add(`<linearGradient id="divGrad" x1="0" y1="0" x2="1" y2="0">`);
            add(`  <stop offset="0%"   stop-color="${PURPLE}" stop-opacity="0"/>`);
            add(`  <stop offset="25%"  stop-color="${PURPLE}" stop-opacity="0.7"/>`);
            add(`  <stop offset="75%"  stop-color="${CYAN}"   stop-opacity="0.7"/>`);
            add(`  <stop offset="100%" stop-color="${CYAN}"   stop-opacity="0"/>`);
            add('</linearGradient>');
            add(`<radialGradient id="topGlow" cx="50%" cy="0%" r="70%" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="${W}" y2="${H}">`);
            add(`  <stop offset="0%"   stop-color="${PURPLE}" stop-opacity="0.12"/>`);
            add(`  <stop offset="100%" stop-color="${PURPLE}" stop-opacity="0"/>`);
            add('</radialGradient>');
            add('<pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">');
            add('  <circle cx="0.8" cy="0.8" r="0.8" fill="#ffffff" opacity="0.045"/>');
            add('</pattern>');
            add('<filter id="glow" x="-30%" y="-30%" width="160%" height="160%">');
            add('  <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>');
            add('  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>');
            add('</filter>');
            for (const [lang] of topLangs) {
              const c = LANG_COLORS[lang] || SUBL;
              const id = `lg${lang.replace(/[^a-z0-9]/gi,'_')}`;
              add(`<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="0">`);
              add(`  <stop offset="0%"   stop-color="${c}" stop-opacity="1"/>`);
              add(`  <stop offset="100%" stop-color="${c}" stop-opacity="0.35"/>`);
              add('</linearGradient>');
            }

            // clip path
            add(`<clipPath id="clip"><rect width="${W}" height="${H}" rx="14"/></clipPath>`);
            add(`</defs>`);

            // ── card base ─────────────────────────────────────────────────────
            add(`<g class="card">`);
            add(`<g clip-path="url(#clip)">`);
            add(`<rect width="${W}" height="${H}" fill="url(#bgGrad)"/>`);
            add(`<rect width="${W}" height="${H}" fill="url(#dots)"/>`);
            add(`<rect width="${W}" height="${H}" fill="url(#topGlow)"/>`);
            add(`</g>`);

            // border
            add(`<rect width="${W}" height="${H}" rx="14" fill="none" stroke="url(#accentGrad)" stroke-width="1" stroke-opacity="0.25"/>`);

            // top accent bar
            add(`<rect x="0" y="0" width="${W}" height="3" rx="0" fill="url(#accentGrad)" clip-path="url(#clip)"/>`);

            // tech corner brackets
            const B = 14;
            add(`<path d="M${PAD} ${8+B} L${PAD} ${8} L${PAD+B} ${8}" fill="none" stroke="${CYAN}" stroke-width="1.2" opacity="0.4"/>`);
            add(`<path d="M${W-PAD-B} ${8} L${W-PAD} ${8} L${W-PAD} ${8+B}" fill="none" stroke="${CYAN}" stroke-width="1.2" opacity="0.4"/>`);
            add(`<path d="M${PAD} ${H-8-B} L${PAD} ${H-8} L${PAD+B} ${H-8}" fill="none" stroke="${CYAN}" stroke-width="1.2" opacity="0.4"/>`);
            add(`<path d="M${W-PAD-B} ${H-8} L${W-PAD} ${H-8} L${W-PAD} ${H-8-B}" fill="none" stroke="${CYAN}" stroke-width="1.2" opacity="0.4"/>`);

            // ── header ────────────────────────────────────────────────────────
            add(`<text x="${PAD}" y="41" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" fill="${CYAN}" letter-spacing="3.5" filter="url(#glow)">CODING STATS</text>`);
            add(`<text x="${PAD+152}" y="41" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="${SUBL}" letter-spacing="2">· LAST ${DAYS} DAYS</text>`);
            add(`<text x="${W-PAD}" y="41" font-family="'Courier New',Consolas,monospace" font-size="10" fill="${SUBL}" text-anchor="end">${esc(period)}</text>`);
            add(`<rect x="${PAD}" y="${H_HEADER}" width="${W-PAD*2}" height="1" fill="url(#divGrad)"/>`);

            // ── stats row ─────────────────────────────────────────────────────
            const cells = [
              [`+${fmt(totalAdd)}`, 'LINES ADDED',   GREEN,  'anim-1'],
              [`-${fmt(totalDel)}`, 'LINES REMOVED', RED,    'anim-2'],
              [String(Object.keys(repoCommits).length), 'REPOS', CYAN, 'anim-3'],
              [String(totalCommits), 'COMMITS',      GOLD,   'anim-4'],
            ];
            const cw = (W - PAD*2) / 4;
            for (const [i, [val, label, color, cls]] of cells.entries()) {
              const cx = PAD + i*cw + cw/2;
              const cellX = PAD + i*cw + 6;
              const cellY = H_HEADER + 10;
              const cellW = cw - 12;
              const cellH = H_STATS - 20;
              add(`<rect x="${cellX}" y="${cellY}" width="${cellW}" height="${cellH}" rx="10" fill="${color}" fill-opacity="0.06" stroke="${color}" stroke-opacity="0.18" stroke-width="1"/>`);
              add(`<text x="${cx}" y="${H_HEADER+58}" font-family="'Segoe UI',system-ui,sans-serif" font-size="28" font-weight="700" fill="${color}" text-anchor="middle" filter="url(#glow)" class="${cls}">${esc(val)}</text>`);
              add(`<text x="${cx}" y="${H_HEADER+78}" font-family="'Segoe UI',system-ui,sans-serif" font-size="8" fill="${SUBL}" text-anchor="middle" letter-spacing="2">${label}</text>`);
            }
            add(`<rect x="${PAD}" y="${H_HEADER+H_STATS}" width="${W-PAD*2}" height="1" fill="url(#divGrad)"/>`);

            // ── 2-column bottom: languages (left) + repos (right) ─────────────
            const colTop = H_HEADER + H_STATS;
            const LX = PAD;
            const RX = PAD + COL_W + COL_GAP;

            // vertical column divider
            add(`<line x1="${PAD+COL_W+COL_GAP/2}" y1="${colTop+16}" x2="${PAD+COL_W+COL_GAP/2}" y2="${colTop+H_BOTTOM-16}" stroke="${PURPLE}" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3,4"/>`);

            // ── languages (left column) ───────────────────────────────────────
            let ly0 = colTop + 22;
            add(`<text x="${LX}" y="${ly0}" font-family="'Segoe UI',system-ui,sans-serif" font-size="8" font-weight="700" fill="${SUBL}" letter-spacing="3">LANGUAGES</text>`);
            const nameW = 100, pctW = 36, barW = COL_W - nameW - pctW, barH = 6;
            if (topLangs.length) {
              for (const [i, [lang, b]] of topLangs.entries()) {
                const ly   = ly0 + 22 + i*32;
                const pct  = Math.round(b/totalLB*100);
                const lc   = LANG_COLORS[lang] || SUBL;
                const gid  = `lg${lang.replace(/[^a-z0-9]/gi,'_')}`;
                const tx   = LX + nameW;
                const fill = Math.max(5, Math.round(barW * pct/100));
                add(`<circle cx="${LX+5}" cy="${ly+3}" r="4" fill="${lc}" opacity="0.85"/>`);
                add(`<text x="${LX+14}" y="${ly+7}" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="${WHITE}">${esc(lang)}</text>`);
                add(`<rect x="${tx}" y="${ly}" width="${barW}" height="${barH}" rx="3" fill="#ffffff" fill-opacity="0.05"/>`);
                add(`<rect x="${tx}" y="${ly}" width="${fill}" height="${barH}" rx="3" fill="url(#${gid})"/>`);
                add(`<text x="${LX+COL_W}" y="${ly+7}" font-family="'Courier New',Consolas,monospace" font-size="10" fill="${SUBL}" text-anchor="end">${pct}%</text>`);
              }
            } else {
              add(`<text x="${LX}" y="${ly0+24}" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="${SUBL}">No activity this period</text>`);
            }

            // ── top repos (right column) ──────────────────────────────────────
            if (topRepos.length) {
              let ry = colTop + 22;
              add(`<text x="${RX}" y="${ry}" font-family="'Segoe UI',system-ui,sans-serif" font-size="8" font-weight="700" fill="${SUBL}" letter-spacing="3">TOP REPOS</text>`);
              for (const [i, [repo, s]] of topRepos.entries()) {
                const rowY = ry + 22 + i*32;
                const short = repo.split('/')[1];
                if (i % 2 === 0) add(`<rect x="${RX}" y="${rowY-11}" width="${COL_W}" height="26" rx="5" fill="#ffffff" fill-opacity="0.025"/>`);
                add(`<text x="${RX+6}" y="${rowY+5}" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="${WHITE}">${esc(short)}</text>`);
                add(`<text x="${RX+COL_W}" y="${rowY+5}" font-family="'Courier New',Consolas,monospace" font-size="10" text-anchor="end"><tspan fill="${GREEN}">+${fmt(s.add)}</tspan><tspan fill="${SUBL}">  </tspan><tspan fill="${RED}">-${fmt(s.del)}</tspan><tspan fill="${SUBL}">  </tspan><tspan fill="${SUB}">${s.commits}c</tspan></text>`);
              }
            }

            // ── footer ────────────────────────────────────────────────────────
            add(`<text x="${W/2}" y="${H-13}" font-family="'Segoe UI',system-ui,sans-serif" font-size="8" fill="${SUB}" text-anchor="middle" letter-spacing="2.5" opacity="0.5">AUTO · UPDATED · WEEKLY</text>`);

            add(`</g>`);
            add(`</svg>`);

            fs.writeFileSync('stats.svg', lines.join('\n'));
            console.log(`Written stats.svg (${H}px)`);

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg
          git diff --cached --quiet || git commit -m "chore: update coding stats [skip ci]"
          git push
