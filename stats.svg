<svg width="740" height="283" viewBox="0 0 740 283" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
  @keyframes fadein { from{opacity:0} to{opacity:1} }
  @keyframes pulse  { 0%,100%{opacity:1} 50%{opacity:.4} }
  @keyframes snake  { 0%{stroke-dashoffset:0} 100%{stroke-dashoffset:-2046} }
  .card   { animation: fadein .4s ease-out both; }
  .snake  { animation: snake 5s linear infinite; }
  .p1     { animation: pulse 4s ease-in-out infinite; }
  .p2     { animation: pulse 4s ease-in-out infinite .8s; }
  .p3     { animation: pulse 4s ease-in-out infinite 1.6s; }
  .p4     { animation: pulse 4s ease-in-out infinite 2.4s; }
</style>
<linearGradient id="bg" x1="0" y1="0" x2=".6" y2="1">
  <stop offset="0%"   stop-color="#1c1625"/>
  <stop offset="50%"  stop-color="#140f1c"/>
  <stop offset="100%" stop-color="#0e0b14"/>
</linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%"  stop-color="#ffffff" stop-opacity=".07"/>
  <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
<linearGradient id="creamBar" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%"   stop-color="#d0b575" stop-opacity="0"/>
  <stop offset="20%"  stop-color="#d0b575" stop-opacity=".7"/>
  <stop offset="80%"  stop-color="#d0b575" stop-opacity=".7"/>
  <stop offset="100%" stop-color="#d0b575" stop-opacity="0"/>
</linearGradient>
<filter id="creamGlow" x="-40%" y="-40%" width="180%" height="180%">
  <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="numglow" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse">
  <path d="M8 0 L0 8" stroke="#ffffff" stroke-opacity=".035" stroke-width=".5"/>
  <path d="M0 0 L8 8" stroke="#ffffff" stroke-opacity=".02"  stroke-width=".5"/>
</pattern>
<clipPath id="clip"><rect width="740" height="283" rx="14"/></clipPath>
</defs>
<g class="card">
<g clip-path="url(#clip)">
<rect width="740" height="283" fill="url(#bg)"/>
<rect width="740" height="283" fill="url(#hatch)"/>
</g>
<rect width="740" height="283" rx="14" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="1"/>
<rect width="740" height="283" rx="14" fill="none" stroke="#d0b575" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="368 1678" class="snake"/>
<text x="22" y="38" font-family="'Cascadia Code','Fira Code','SF Mono',ui-monospace,monospace" font-size="11" font-weight="700" fill="#d0b575" letter-spacing="3.5" filter="url(#creamGlow)">CODING STATS</text>
<text x="156" y="38" font-family="'Cascadia Code','Fira Code','SF Mono',ui-monospace,monospace" font-size="10" fill="#5a4e42" letter-spacing="1.5">· LAST 30 DAYS</text>
<text x="718" y="38" font-family="'Cascadia Code','Fira Code','SF Mono',ui-monospace,monospace" font-size="9.5" fill="#5a4e42" text-anchor="end">Jul 11 – Aug 10</text>
<rect x="22" y="55" width="696" height="94" rx="10" fill="#ffffff" fill-opacity=".05"/>
<rect x="22" y="55" width="696" height="94" rx="10" fill="url(#sheen)"/>
<rect x="22" y="55" width="696" height="94" rx="10" fill="none" stroke="#ffffff" stroke-opacity=".1" stroke-width="1"/>
<rect x="23" y="56" width="694" height="1" fill="#ffffff" fill-opacity=".06"/>
<text x="109" y="107" font-family="'Cascadia Code','Fira Code','SF Mono',ui-monospace,monospace" font-size="25" font-weight="700" fill="#7ec87e" text-anchor="middle" filter="url(#numglow)" class="p1">+0</text>
<text x="109" y="127" font-family="'Cascadia Code','Fira Code','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#5a4e42" text-anchor="middle" letter-spacing="1.5">lines added</text>
<line x1="196" y1="71" x2="196" y2="133" stroke="#ffffff" stroke-opacity=".06" stroke-width="1"/>
<text x="283" y="107" font-family="'Cascadia Code','Fira Code','SF Mono',ui-monospace,monospace" font-size="25" font-weight="700" fill="#c47070" text-anchor="middle" filter="url(#numglow)" class="p2">-0</text>
<text x="283" y="127" font-family="'Cascadia Code','Fira Code','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#5a4e42" text-anchor="middle" letter-spacing="1.5">lines removed</text>
<line x1="370" y1="71" x2="370" y2="133" stroke="#ffffff" stroke-opacity=".06" stroke-width="1"/>
