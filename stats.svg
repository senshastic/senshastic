<text x="457" y="127" font-family="'Cascadia Code','Fira Code','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#5a4e42" text-anchor="middle" letter-spacing="1.5">repos</text>
<line x1="544" y1="71" x2="544" y2="133" stroke="#ffffff" stroke-opacity=".06" stroke-width="1"/>
<text x="631" y="107" font-family="'Cascadia Code','Fira Code','SF Mono',ui-monospace,monospace" font-size="25" font-weight="700" fill="#a08fd4" text-anchor="middle" filter="url(#numglow)" class="p4">0</text>
<text x="631" y="127" font-family="'Cascadia Code','Fira Code','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#5a4e42" text-anchor="middle" letter-spacing="1.5">commits</text>
<rect x="22" y="159" width="696" height="1" fill="url(#creamBar)" opacity=".5"/>
<rect x="22" y="171" width="341" height="78" rx="10" fill="#ffffff" fill-opacity=".05"/>
<rect x="22" y="171" width="341" height="78" rx="10" fill="url(#sheen)"/>
<rect x="22" y="171" width="341" height="78" rx="10" fill="none" stroke="#ffffff" stroke-opacity=".09" stroke-width="1"/>
<rect x="23" y="172" width="339" height="1" fill="#ffffff" fill-opacity=".05"/>
<rect x="377" y="171" width="341" height="78" rx="10" fill="#ffffff" fill-opacity=".05"/>
<rect x="377" y="171" width="341" height="78" rx="10" fill="url(#sheen)"/>
<rect x="377" y="171" width="341" height="78" rx="10" fill="none" stroke="#ffffff" stroke-opacity=".09" stroke-width="1"/>
<rect x="378" y="172" width="339" height="1" fill="#ffffff" fill-opacity=".05"/>
<text x="34" y="189" font-family="'Cascadia Code','Fira Code','SF Mono',ui-monospace,monospace" font-size="7" font-weight="700" fill="#7a6035" letter-spacing="3">LANGUAGES</text>
<text x="389" y="189" font-family="'Cascadia Code','Fira Code','SF Mono',ui-monospace,monospace" font-size="7" font-weight="700" fill="#7a6035" letter-spacing="3">TOP REPOS</text>
<text x="370" y="271" font-family="'Cascadia Code','Fira Code','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#7a6035" text-anchor="middle" letter-spacing="2.5" opacity=".6">AUTO · UPDATED · WEEKLY</text>
</g>
</svg>